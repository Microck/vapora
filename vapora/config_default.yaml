# scan behavior
depth: 2
max_nodes: 500
rate_limit_rpm: 120
skip_private_profiles: true

# feature toggles
include_group_links: true
include_game_overlap: false

# enrichment (for Graphi)
hub_percentile: 0.99  # top 1% betweenness → is_hub

# run mode: full | basic | graphi
run_mode: full

# IRL friend probability options (for estimates)
irl:
  top_n_for_mean: 5
  reasonable_count: 50

# Location probability options (for estimates)
location:
  reasonable_count: 100
  score_strategy: multiply  # multiply | sum

# steamhistory
request_timeout: 25
name: Desktop packages
on:
  pull_request:
  push:
    branches: [main]
    tags: ['[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run package
      - name: Install the Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = Get-Item "release/vapora-$version-win-x64.exe"
          $destination = Join-Path $env:RUNNER_TEMP 'vapora-installed'
          $process = Start-Process $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          Get-Item "$destination\Vapora.exe", "$destination\resources\app.asar"
          "VAPORA_DESKTOP=$destination/Vapora.exe" >> $env:GITHUB_ENV
          "VAPORA_DESKTOP_ASAR=$destination/resources/app.asar" >> $env:GITHUB_ENV
      - name: Extract the Linux download
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x release/*.AppImage
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE"/release/*.AppImage --appimage-extract > /dev/null
          echo "VAPORA_DESKTOP=$RUNNER_TEMP/squashfs-root/vapora" >> "$GITHUB_ENV"
          echo "VAPORA_DESKTOP_ASAR=$RUNNER_TEMP/squashfs-root/resources/app.asar" >> "$GITHUB_ENV"
      - name: Mount the macOS download
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/vapora-dmg"
          hdiutil attach release/*.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/vapora-dmg"
          echo "VAPORA_DESKTOP=$RUNNER_TEMP/vapora-dmg/Vapora.app/Contents/MacOS/Vapora" >> "$GITHUB_ENV"
          echo "VAPORA_DESKTOP_ASAR=$RUNNER_TEMP/vapora-dmg/Vapora.app/Contents/Resources/app.asar" >> "$GITHUB_ENV"
      - name: Test the packaged Linux app
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fluxbox
          # Native maximize/restore needs a window manager on the virtual display.
          xvfb-run -a bash -c '
            fluxbox > "$RUNNER_TEMP/vapora-window-manager.log" 2>&1 &
            window_manager_pid=$!
            trap "kill $window_manager_pid" EXIT
            export VAPORA_HISTORY_SANDBOX=disabled
            npm run test:desktop
          '
      - name: Test the packaged Windows/macOS app
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Test the Windows portable download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = Get-Item release/*-portable.exe
          $env:VAPORA_DESKTOP = $portable.FullName
          $env:VAPORA_DESKTOP_ASAR = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/resources/app.asar'
          $env:VAPORA_TEST_PORTABLE = '1'
          # A real 64 MB TEMP volume reproduces low system-drive space without filling the runner.
          $disk = Join-Path $env:RUNNER_TEMP 'vapora-small-temp.vhd'
          $mount = Join-Path $env:RUNNER_TEMP 'vapora-small-temp'
          New-Item -ItemType Directory $mount | Out-Null
          $diskScript = Join-Path $env:RUNNER_TEMP 'vapora-small-temp.txt'
          @("create vdisk file=`"$disk`" maximum=64 type=expandable", "select vdisk file=`"$disk`"", 'attach vdisk', 'create partition primary', 'format fs=ntfs quick', "assign mount=`"$mount`"") | Set-Content $diskScript
          diskpart /s $diskScript
          $volume = Get-Volume -FilePath "$mount\"
          if ($volume.Size -gt 64MB -or $volume.Size -eq 0) { throw 'Small TEMP volume was not mounted' }
          $env:VAPORA_PORTABLE_TEST_TEMP = Join-Path $mount 'Temp'
          New-Item -ItemType Directory $env:VAPORA_PORTABLE_TEST_TEMP | Out-Null
          npm run test:desktop
      - name: Detach the Windows TEMP test disk
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $disk = Join-Path $env:RUNNER_TEMP 'vapora-small-temp.vhd'
          if (Test-Path $disk) {
            $diskScript = Join-Path $env:RUNNER_TEMP 'vapora-small-temp-detach.txt'
            @("select vdisk file=`"$disk`"", 'detach vdisk') | Set-Content $diskScript
            diskpart /s $diskScript
          }
      - name: Unmount the macOS download
        if: always() && runner.os == 'macOS'
        run: hdiutil detach "$RUNNER_TEMP/vapora-dmg"
      - name: Save verified desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: vapora-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
          retention-days: 7

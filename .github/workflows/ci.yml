name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Browser E2E
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/vapora-screenshots"
          npm run test:e2e
        env:
          VAPORA_BROWSER: /usr/bin/google-chrome
          VAPORA_BROWSER_SCREENSHOTS: ${{ runner.temp }}/vapora-screenshots
      - name: Save browser screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vapora-browser-screenshots
          path: ${{ runner.temp }}/vapora-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

  deterministic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      - run: npx e2e-web install chromium --with-deps
      - run: npm run test:e2e:deterministic
        env:
          E2E_TELEMETRY_DISABLED: "1"
      - name: Preserve failed deterministic browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deterministic-browser-failure-traces
          path: .e2e/results/
          retention-days: 7
          if-no-files-found: ignore
